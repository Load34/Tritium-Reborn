buildscript {

    repositories {
        jcenter()
        mavenLocal()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2' }
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.0' // 使用适合你项目的最新版本
    id 'com.palantir.git-version' version '3.1.0'
}

apply plugin: 'java'
apply plugin: 'com.github.johnrengelman.shadow'

compileJava {
    options.encoding = "UTF-8"
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

group 'net.minecraft'
// version '1.0-SNAPSHOT'

allprojects {
    repositories {
        maven {
        url "https://maven.aliyun.com/repository/public"
        }
        mavenLocal()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2' }
        maven {
            url "https://repo.marcloud.net/"
        }
        maven {
            url "https://repo.papermc.io/repository/maven-public/"
        }
    }
}

dependencies {
    // compile group: 'net.minecraft', name: 'minecraft', version: '1.8.9'//游戏本体
    compileOnly 'io.netty:netty-all:4.1.82.Final'
    compileOnly 'com.mojang:patchy:1.7.7'
    compileOnly 'net.sf.jopt-simple:jopt-simple:4.6'
    compileOnly 'net.java.jinput:jinput:2.0.5'
    compileOnly 'com.mojang:icu4j-core-mojang:51.2'

    compileOnly 'org.apache.httpcomponents:httpclient:4.3.3'
    compileOnly 'org.apache.httpcomponents:httpcore:4.3.2'

    compileOnly 'oshi:oshi-core:1.1'

    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    compileOnly 'org.lwjgl.lwjgl:lwjgl-platform:2.9.4-nightly-20150209'
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    compileOnly 'com.paulscode.sound:libraryjavasound:20101123'
    compileOnly 'com.paulscode.sound:codecwav:20101023'
    compileOnly 'com.paulscode.sound:soundsystem:20120107'
    compileOnly 'com.paulscode.sound:codecjorbis:20101023'
    compileOnly 'com.paulscode.sound:librarylwjglopenal:20100824'

    compileOnly 'commons-logging:commons-logging:1.1.3'

    compileOnly 'org.apache.commons:commons-compress:1.8.1'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.15.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.15.0'

    compileOnly 'com.google.guava:guava:17.0'
    compileOnly 'org.apache.commons:commons-lang3:3.3.2'

    compileOnly 'commons-io:commons-io:2.11.0'
    compileOnly 'commons-codec:commons-codec:1.9'
    compileOnly 'com.google.code.gson:gson:2.2.4'

    compileOnly 'com.mojang:authlib:1.5.21'
	
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// shadowJar {
//     dependencies {
//         include(dependency('net.minecraft:minecraft'))
//     }
// }

jar {
    from configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

//build.dependsOn shadowJar